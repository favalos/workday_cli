[package]
name = "workday_cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
open = "5"
security-framework = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.44", features = ["serde"] }
urlencoding = "2"

tiny_http = { version = "0.12", features = ["ssl-rustls"] }
ureq = "2"
